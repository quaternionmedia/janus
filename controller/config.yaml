# Janus controller configuration.
#
# Loaded once at startup. Restart the controller to apply changes.
#
# Any value can be overridden at startup by a CLI flag of the same name:
#     uv run input_router.py --mouse /dev/input/by-id/...

# ---------------------------------------------------------------------------
# Active device file
# ---------------------------------------------------------------------------
#
# Names a YAML file in controller/profiles/ whose `devices:` section
# supplies all device paths (mouse, keyboard, personal_uart, work_uart).
# Swap to a different hardware setup by changing this one line.
#
# If the named file is missing or unreadable, the controller logs a loud
# warning and falls back to the hardcoded device paths in
# input_router.py's DEFAULT_CONFIG (Logitech-K400-style defaults). It will
# start, but it likely won't find your actual hardware -- check the log.
#
# Available device files (controller/profiles/):
#   logitech_k400.yaml      Logitech K400 Plus wireless combo receiver
#   razer_steelseries.yaml  Razer Basilisk V3 + SteelSeries Apex (current)

device_config_file: "razer_steelseries.yaml"

# ---------------------------------------------------------------------------
# Non-device settings
# ---------------------------------------------------------------------------

serial:
  # UART line rate. Must match both bridges and both agents exactly.
  baud: 921600

switching:
  # Cursor must be within this many pixels of the edge before push
  # accumulation can begin.
  edge_arm_pixels: 2

  # Total raw mouse_dy units required (accumulated while the cursor is in
  # the arm zone, moving toward the edge) before an auto-switch fires.
  # This value is DEVICE-SENSITIVE: a high-DPI gaming mouse generates many
  # more units per inch of physical movement than a trackpad, so the same
  # value feels much "easier" to trigger on a Razer than it did on a K400.
  # If switching feels too eager (or too sluggish), this is the knob.
  switch_push_pixels: 12

  # Vertical offset from the destination's top/bottom edge at which the
  # cursor lands after a switch.
  switch_entry_margin_y: 32

  # Post-switch window during which edge arming is suppressed. Prevents
  # a direction reversal right after landing from bouncing the cursor
  # back to the previous side.
  switch_cooldown_seconds: 0.15

  # How often the controller re-broadcasts the current active target.
  # Late-joining agents pick up their state within one interval.
  target_announce_interval_seconds: 2.0

commands:
  # Single-character commands typed in the controller terminal.
  # Each must be exactly one character. Case-insensitive at runtime.
  # All four must be distinct.
  personal: p
  work: w
  clipboard: c
  quit: q

logging:
  # When true, log every mouse-button event and MOUSE MOVE forward.
  # Useful when debugging input issues; otherwise leave false to keep
  # the controller log readable.
  verbose: false