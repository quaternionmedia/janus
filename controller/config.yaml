# Janus controller configuration.
#
# Loaded once at startup. Restart the controller to apply changes.
#
# Any value can be overridden at startup by a CLI flag of the same name:
#     uv run input_router.py --mouse /dev/input/by-id/...

# ---------------------------------------------------------------------------
# Active device file
# ---------------------------------------------------------------------------
#
# Names a YAML file in controller/profiles/ whose `devices:` section
# supplies all device paths (mouse, keyboard, personal_uart, work_uart).
# Swap to a different hardware setup by changing this one line.
#
# If the named file is missing or unreadable, the controller logs a loud
# warning and falls back to the hardcoded device paths in
# input_router.py's DEFAULT_CONFIG (Logitech-K400-style defaults). It will
# start, but it likely won't find your actual hardware -- check the log.
#
# Available device files (controller/profiles/):
#   logitech_k400.yaml      Logitech K400 Plus wireless combo receiver
#   razer_steelseries.yaml  Razer Basilisk V3 + SteelSeries Apex (current)

device_config_file: "razer_steelseries.yaml"

# ---------------------------------------------------------------------------
# Non-device settings
# ---------------------------------------------------------------------------

serial:
  # UART line rate. Must match both bridges and both agents exactly.
  baud: 921600

switching:
  # When true, the controller automatically switches the active target
  # when the cursor pushes against the source monitor's edge for long
  # enough (see edge_arm_pixels + switch_push_pixels below).
  # When false, switching only happens via explicit triggers: 'p'/'w'
  # in the controller terminal, 's' in an agent's console, or the
  # agent's global switch hotkey. Recommended for tray-icon-heavy
  # workflows where reaching for the taskbar can trip the auto-switch.
  auto_edge_switch_enabled: false

  # Cursor must be within this many pixels of the edge before push
  # accumulation can begin.
  edge_arm_pixels: 2

  # Total raw mouse_dy units required (accumulated while the cursor is in
  # the arm zone, moving toward the edge) before an auto-switch fires.
  # This value is DEVICE-SENSITIVE: a high-DPI gaming mouse generates many
  # more units per inch of physical movement than a trackpad, so the same
  # value feels much "easier" to trigger on a Razer than it did on a K400.
  # If switching feels too eager (or too sluggish), this is the knob.
  switch_push_pixels: 12

  # Vertical offset from the destination's top/bottom edge at which the
  # cursor lands after a switch.
  switch_entry_margin_y: 32

  # Post-switch window during which edge arming is suppressed. Prevents
  # a direction reversal right after landing from bouncing the cursor
  # back to the previous side.
  switch_cooldown_seconds: 0.15

  # How often the controller re-broadcasts the current active target.
  # Late-joining agents pick up their state within one interval.
  target_announce_interval_seconds: 2.0

  # ---- Dead-peer detection ------------------------------------------------
  #
  # If the active target's agent goes silent for this many seconds,
  # consider it dead. Heartbeats are any inbound serial line from the
  # agent: TARGET echoes (every ~2s in response to the controller's own
  # broadcasts), CURSOR keepalives, DISPLAY refreshes, CLIPBOARD events.
  # Catches failure modes that the agent's SwitchOnShutdown can't catch:
  # BSOD / kernel panic, hard power loss, USB disconnect between Pico
  # and host PC, agent process force-killed without OS shutdown
  # notification.
  #
  # Tradeoff: too low and brief scheduling hiccups can trigger false
  # positives; too high and the user is "stuck" routing to a dead PC
  # for that long before recovery. 10s with a 2s heartbeat gives 5
  # missed beats before deciding "dead," which is very unlikely to be
  # transient.
  dead_peer_threshold_seconds: 10.0

  # After a dead-peer auto-switch fires, no further auto-switch can
  # fire for this many seconds. Prevents flapping if the user manually
  # tries to switch back to the dead peer immediately. After the
  # cooldown elapses, the detector will fire again if the active is
  # still dead -- which means trying to manually use a dead peer
  # within ~30s of a recent auto-switch will hold; trying again after
  # 30s will get auto-corrected.
  dead_peer_switch_cooldown_seconds: 30.0

  # Home-base side for dead-peer auto-switch. Asymmetric by design:
  # auto-switch never moves AWAY from home base. With "P" as home base
  # (typical):
  #   * On Work, Work dies, Personal alive  -> auto-switch to Personal
  #   * On Personal, Personal dies, Work alive  -> do NOTHING (Personal
  #     dying is a "fix Personal" event, not "use Work")
  #   * On Personal, Personal alive  -> no action (active is fine)
  #
  # Set to "P" or "W" to pick a side. Set to null to disable dead-peer
  # auto-switch entirely (the detector will still log "dead peer
  # detected" diagnostics but won't switch).
  #
  # SCOPE: this only governs the dead-peer auto-switch path. Manual
  # switches (stdin p/w in the Pi console, the Right Ctrl+Right Alt+P/W
  # force-switch hotkey, the agent's 's' hotkey -> SWITCH PEER) and
  # auto-edge-switch are unaffected -- the user can still move off
  # home base by any of those normal means whenever they want.
  dead_peer_home_base: "P"

commands:
  # Single-character commands typed in the controller terminal.
  # Each must be exactly one character. Case-insensitive at runtime.
  # All four must be distinct.
  personal: p
  work: w
  clipboard: c
  quit: q

logging:
  # When true, log every mouse-button event and MOUSE MOVE forward.
  # Useful when debugging input issues; otherwise leave false to keep
  # the controller log readable.
  verbose: false